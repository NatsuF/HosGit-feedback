name: 🐛 Bug 反馈
description: 报告 HosGit 使用中遇到的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，信息越全问题定位越快。

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 「我的 → 关于」页可见，如 2.6.7
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备型号与系统版本
      description: 如 Mate 60 / HarmonyOS 5.0.1
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 应用闪退 / 卡死
        - 功能异常（结果不对 / 无响应）
        - 界面显示问题
        - 推送通知问题
        - 登录 / 账号问题
        - 其他
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？期望是什么、实际是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何一步步触发这个问题？偶发问题请说明触发条件
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…

  - type: textarea
    id: media
    attributes:
      label: 截图 / 录屏 / 日志
      description: 有截图或录屏请直接拖入；如涉及推送请附通知截图
