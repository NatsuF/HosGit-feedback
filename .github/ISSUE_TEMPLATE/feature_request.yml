name: 💡 功能建议
description: 对 HosGit 的新功能想法或改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提建议！描述越具体，越容易被采纳。

  - type: textarea
    id: suggestion
    attributes:
      label: 建议内容
      description: 想要什么功能或改进？尽量具体
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么情况下会用到它？解决什么问题？
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 参考
      description: 其他 App 有类似功能吗？（官网截图、链接均可）
